pgrole: 'gethomepage'
intport: '3000'
image: 'ghcr.io/gethomepage/homepage:latest'
pg_volumes:
  - "/etc/localtime:/etc/localtime:ro"
  - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{ pgrole }}/config:/app/config:rw"
  - "/var/run/docker.sock:/var/run/docker.sock:ro"
pg_env:
  HOMEPAGE_ALLOWED_HOSTS: "{{ sub[pgrole][pgrole] if sub_enabled else pgrole }}.{{user.domain}}"
  PUID: "{{ lookup('env','MYUID') }}"
  # PGID forcé au groupe "docker" (GID 1001) plutôt que celui de l'utilisateur :
  # l'entrypoint fait un `su-exec PUID:PGID` qui jette les groupes secondaires,
  # donc `docker_container.groups` seul ne suffit pas pour lire /var/run/docker.sock.
  PGID: "1001"
